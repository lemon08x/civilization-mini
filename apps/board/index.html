<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>世代 · 家族编年史</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="chronicle-body">
  <div id="error" role="alert" hidden tabindex="-1"></div>
  <div id="app"></div>
  <dialog id="confirm-dialog" class="chronicle-dialog" aria-labelledby="confirm-title">
    <form method="dialog" id="confirm-form">
      <h2 id="confirm-title">确认行动</h2>
      <div id="confirm-body"></div>
      <div class="dialog-actions">
        <button value="cancel" class="text-btn">取消</button>
        <button value="confirm" id="confirm-submit" class="primary-btn">确认提交</button>
      </div>
    </form>
  </dialog>
  <footer class="chronicle-footer">
    <p><a href="/start">打开其他旅程</a> · <a href="/">入口</a> · <a href="/ai">AI 文本玩法</a></p>
    <div class="tools">
      <button type="button" id="export">导出存档</button>
      <label class="file-button">导入存档<input id="import" type="file" accept=".json,application/json" hidden></label>
    </div>
    <p>结果由固定规则结算。浏览器存档可在开始界面打开或新开；命令行存档在 saves/。</p>
  </footer>
  <script type="module" src="/modules/apps/board/economy-app.js"></script>
</body>
</html>

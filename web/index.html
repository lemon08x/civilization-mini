<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>世代 · 规则实验桌</title>
  <link rel="stylesheet" href="/web/style.css">
</head>
<body>
  <header class="masthead">
    <div><div class="eyebrow">CIVILIZATION MINI / RESEARCH 001</div><h1>世代 <span>规则实验桌</span></h1><p>先让世界运行，再问一门技艺为什么值得学。</p></div>
    <div class="setup"><label>起始环境<select id="scenario"><option value="river">河渠村落</option><option value="dry">缺水村落</option></select></label><label>实验种子<input id="seed" type="number" value="17" min="1" max="4294967295"></label><button id="new-game">开启新实验</button></div>
  </header>
  <div class="notice">规则预研 v0.1.0 · 一个地区 / 两代 / 灌溉与种源 · 数值未经平衡验证 · 每代八季是实验窗口，不是人物寿命</div>
  <div id="error" role="alert" hidden></div>
  <main id="app"></main>
  <footer>
    <div class="tools"><button id="export">导出可重放存档</button><label class="file-button">导入存档<input id="import" type="file" accept=".json,application/json" hidden></label><button id="observation">导出 AI 可见观察</button></div>
    <p>结果由固定规则结算；脚本或 AI 只能选择行动。存档只保存在本机浏览器，命令行实验使用独立文件。</p>
  </footer>
  <script type="module" src="/web/app.mjs"></script>
</body>
</html>
